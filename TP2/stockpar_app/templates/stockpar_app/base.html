<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPar - Presupuestos USD/ARS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        @media print {
            .ocultar-impresion { display: none !important; }
            body { background-color: white; }
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 ocultar-impresion">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">💵 StockPar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">Inicio y Cotización</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'crear_presupuesto' %}">+ Nuevo Presupuesto</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'lista_presupuestos' %}">Historial Presupuestos</a>
                    </li>
                </ul>
                <a href="/admin/" class="btn btn-outline-light btn-sm" target="_blank">Panel Admin</a>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <div class="container">
        {% if messages %}
            {% for mensaje in messages %}
                <div class="alert alert-{{ mensaje.tags|default:'info' }} alert-dismissible fade show ocultar-impresion" role="alert">
                    {{ mensaje }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts_extra %}{% endblock %}
</body>
</html>
